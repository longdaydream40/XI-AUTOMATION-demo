.tilt-scene{position:absolute;inset:0;perspective:calc(var(--stage)*1.2)}
.tilt-plane{position:absolute;inset:0;transform-style:preserve-3d;--tilt-depth:0}
.portrait-zone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:translateZ(calc(var(--stage)*.015*var(--tilt-depth)))}
.portrait-wrap{position:relative;width:46.44%;aspect-ratio:1}
#glitch{position:absolute;inset:0;width:100%;height:100%;display:block}
.text-zone{position:absolute;left:47.5%;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 4.5% 0 4%;transform:translateZ(calc(var(--stage)*.035*var(--tilt-depth)))}
.word{font-family:'Cal Sans',sans-serif;font-weight:400;white-space:nowrap;line-height:1;color:var(--ink);opacity:0;-webkit-font-smoothing:antialiased}
#w-xi{font-size:clamp(40px,12vw,156px);letter-spacing:.015em;width:fit-content;position:relative}
#w-xi .ch{display:inline-block}
#w-caret{position:absolute;top:.13em;left:100%;width:.055em;height:.72em;background:var(--ink);opacity:0}
#w-auto{margin-top:.5em;font-size:clamp(10px,3.1vw,44px);letter-spacing:.14em;line-height:1}
@media(max-aspect-ratio:3/4){
 :root{--slide-x:0px;--slide-y:calc(var(--stage)*-.22)}
 .stage{height:min(115vw,90dvh)}
 .portrait-wrap{width:64%}
 .text-zone{left:0;top:60%;bottom:4%;padding:0;align-items:center}
 #w-xi{font-size:clamp(40px,16vw,76px)}
 #w-auto{font-size:clamp(12px,4.2vw,22px)}
}
