<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>XI AUTOMATION · MONO</title>
<style>
@font-face{font-family:'Cal Sans';font-style:normal;font-weight:400;font-display:block;src:url({{FONT_DATA_URI}}) format('woff2')}
:root{--stage:min(100vw,177.78vh);--ink:#f2f0ec;--slide-x:calc(var(--stage)*-.23);--slide-y:0px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage{position:relative;overflow:hidden;width:var(--stage);height:min(56.25vw,100dvh)}
.tilt-scene{position:absolute;inset:0;perspective:calc(var(--stage)*1.2)}
.tilt-plane{position:absolute;inset:0;transform-style:preserve-3d;--tilt-depth:0}
.portrait-zone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:translateZ(calc(var(--stage)*.015*var(--tilt-depth)))}
.portrait-wrap{position:relative;width:46.44%;aspect-ratio:1}
#glitch{position:absolute;inset:0;width:100%;height:100%;display:block}
.text-zone{position:absolute;left:47.5%;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 4.5% 0 4%;transform:translateZ(calc(var(--stage)*.035*var(--tilt-depth)))}
.word{font-family:'Cal Sans',sans-serif;font-weight:400;white-space:nowrap;line-height:1;color:var(--ink);opacity:0;-webkit-font-smoothing:antialiased}
#w-xi{font-size:clamp(40px,12vw,156px);letter-spacing:.015em;width:fit-content;position:relative}
#w-xi .ch{display:inline-block}
#w-caret{position:absolute;top:.13em;left:100%;width:.055em;height:.72em;background:var(--ink);opacity:0}
#w-auto{margin-top:.5em;font-size:clamp(10px,3.1vw,44px);letter-spacing:.14em;line-height:1}
@media(max-aspect-ratio:3/4){
 :root{--slide-x:0px;--slide-y:calc(var(--stage)*-.22)}
 .stage{height:min(115vw,90dvh)}
 .portrait-wrap{width:64%}
 .text-zone{left:0;top:60%;bottom:4%;padding:0;align-items:center}
 #w-xi{font-size:clamp(40px,16vw,76px)}
 #w-auto{font-size:clamp(12px,4.2vw,22px)}
}
</style>
</head>
<body>
<div class="stage" id="stage">
 <div class="tilt-scene"><div class="tilt-plane" id="tilt-plane">
  <div class="portrait-zone"><div class="portrait-wrap" id="pwrap"><canvas id="glitch"></canvas></div></div>
  <div class="text-zone">
   <div class="word" id="w-xi"><span class="ch">X</span><span class="ch">I</span><span id="w-caret"></span></div>
   <div class="word" id="w-auto">AUTOMATION</div>
  </div>
 </div></div>
</div>
<script>
'use strict';
{{SHARED_SCRIPT}}
// Editorial flashes keep their 25 fps cadence; spatial motion uses fractional frames.
const FPS = 25, COLS = 12, ROWS = 16, NCELL = COLS * ROWS;
const q = new URLSearchParams(location.search);
const finite = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
const frozen = q.has('f') || q.has('t');
const freezeTime = q.has('f') ? finite(q.get('f')) / FPS : q.has('t') ? finite(q.get('t')) : null;
const $ = id => document.getElementById(id);
const stage = $('stage'), plane = $('tilt-plane'), pwrap = $('pwrap');
const wXi = $('w-xi'), wAuto = $('w-auto'), wCaret = $('w-caret');
const chars = [...wXi.querySelectorAll('.ch')];
const tilt = attachTilt(plane, { disabled: frozen });
const canvas = $('glitch'), ctx = canvas.getContext('2d');
const base = document.createElement('canvas'), ghost = document.createElement('canvas');
let SZ = 0, CW = 0, CH = 0, ready = false, lastPortraitFrame = -1, resizeRAF = 0;
const cache = new WeakMap();
function set(el, prop, value){
 let c = cache.get(el); if (!c){ c = {}; cache.set(el, c); }
 if (c[prop] !== value){ c[prop] = value; el.style[prop] = value; }
}
function hash(n){
 n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
 n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
 return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
const clamp01 = p => Math.max(0, Math.min(1, p));
const smooth = p => p * p * (3 - 2 * p);
const prog = (f, a, b) => smooth(clamp01((f - a) / (b - a)));
function track(keys, frame){
 if (frame <= keys[0][0]) return keys[0][1];
 const last = keys.length - 1;
 if (frame >= keys[last][0]) return keys[last][1];
 const slope = i => (keys[i+1][1] - keys[i][1]) / (keys[i+1][0] - keys[i][0]);
 const tangent = i => {
  if (i === 0) return slope(0);
  if (i === last) return slope(last - 1);
  const a = slope(i - 1), b = slope(i);
  if (a * b <= 0) return 0;
  const h0 = keys[i][0] - keys[i-1][0], h1 = keys[i+1][0] - keys[i][0];
  const w0 = 2*h1+h0, w1 = h1+2*h0;
  return (w0+w1)/(w0/a+w1/b);
 };
 let i = 0; while (frame > keys[i+1][0]) i++;
 const h = keys[i+1][0] - keys[i][0], p = (frame-keys[i][0])/h;
 return (2*p*p*p-3*p*p+1)*keys[i][1] + (p*p*p-2*p*p+p)*h*tangent(i)
  + (-2*p*p*p+3*p*p)*keys[i+1][1] + (p*p*p-p*p)*h*tangent(i+1);
}
// Reference leftEdge trajectory, with continuous velocity between measured keys.
const SLIDE_KEYS = [
 [0,0],[1,.0034],[2,.0068],[3,.0203],[4,.0372],[5,.0676],[6,.1115],[7,.1723],
 [8,.25],[9,.3311],[10,.4155],[11,.4932],[12,.5608],[13,.6216],[14,.6723],
 [15,.7196],[16,.7568],[17,.7905],[18,.8209],[19,.848],[20,.8716],[21,.8919],
 [22,.9088],[23,.9257],[24,.9392],[25,.9493],[26,.9595],[27,.9696],[28,.9764],
 [29,.9831],[30,.9899],[31,.9932],[32,.9966],[34,1]
];
const INK_OPACITY = [[-1,0],[0,.4],[1,.65],[2,.88],[3,1]];
const order = Array.from({length:NCELL}, (_, i) => {
 const dx = i % COLS + .5 - 4.6, dy = Math.floor(i / COLS) + .5 - 4.4;
 return {i, d:Math.hypot(dx, dy*Math.sqrt(1.25)) + hash(i*31+7)*2.6};
}).sort((a,b) => a.d-b.d);
const revealAt = new Float64Array(NCELL);
order.forEach(({i}, rank) => { revealAt[i] = 3 + rank / (NCELL-1) * 19; });
function drawPortrait(f){
 ctx.clearRect(0,0,SZ,SZ);
 if (f < 26){
  const gp = prog(f,2,10);
  for(let ci=0;ci<NCELL;ci++){
   // Integer cell edges avoid alpha seams at fractional canvas coordinates.
   const col=ci%COLS,row=Math.floor(ci/COLS);
   const x=Math.round(col*CW),y=Math.round(row*CH);
   const w=Math.round((col+1)*CW)-x,h=Math.round((row+1)*CH)-y;
   const age=f-revealAt[ci],sd=ci*977+13;
   if(age<0){
    ctx.globalAlpha=gp*(.07+.15*clamp01((age+7)/7));
    ctx.drawImage(ghost,x,y,w,h,x,y,w,h); continue;
   }
   let alpha=1,dx=0,dy=0;
   if(hash(sd+91)<.28 && age<3){
    if(age<1){alpha=.82;dx=(hash(sd)-.5)*22;dy=(hash(sd+1)-.5)*6;}
    else if(age<2) dx=(hash(sd+2)-.5)*-16;
   }
   ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.globalAlpha=alpha;
   ctx.drawImage(base,dx,dy);ctx.restore();
  }
  ctx.globalAlpha=1;return;
 }
 ctx.globalAlpha=1;ctx.drawImage(base,0,0);
 if(f<28 || f>=40)return;
 const p=.46*(1-prog(f,28,40));
 for(let ci=0;ci<NCELL;ci++){
  const phase=Math.floor(hash(ci*131+7)*3),step=Math.floor((f+phase)/3);
  const r=hash(ci*977+step*7919);
  if(r>=p)continue;
  const col=ci%COLS,row=Math.floor(ci/COLS),x=Math.round(col*CW),y=Math.round(row*CH);
  const w=Math.round((col+1)*CW)-x,h=Math.round((row+1)*CH)-y;
  ctx.clearRect(x,y,w,h);
  if(r>=p*.46)ctx.drawImage(ghost,x,y,w,h,x,y,w,h);
 }
}
// One gesture per character: the caret sweeps across the glyph over the same
// window the glyph fades, and stops exactly when it is gone. Erasing first and
// gliding afterwards reads as two separate events instead of one backspace.
// The trailing DEL_HOLD frames are a beat where the caret stands still before
// the next character starts to go. DEL_TRAVEL must stay >= 1 frame.
const CUR_ON=84,DEL_FROM=96,DEL_HOLD=3;
const DEL_STEP=Math.max(DEL_HOLD+1,Math.min(10,Math.floor(50/chars.length)));
const DEL_TRAVEL=DEL_STEP-DEL_HOLD;
const DEL_TO=DEL_FROM+DEL_STEP*chars.length,DURATION=(DEL_TO+4)/FPS;
let boundaries=[0,0.5,1],boxLeft=0,textWidth=0;
function measureChars(){
 // Measure in the unrotated plane, not the perspective-projected screen bounds.
 const transform=plane.style.transform,depth=plane.style.getPropertyValue('--tilt-depth');
 plane.style.transform='none';plane.style.setProperty('--tilt-depth','0');
 const original=wXi.style.transform;set(wXi,'transform','none');
 const box=wXi.getBoundingClientRect();boxLeft=box.left;textWidth=box.width;
 const range=document.createRange();boundaries=[0];
 for(const ch of chars){range.selectNodeContents(ch);boundaries.push((range.getBoundingClientRect().right-box.left)/box.width);}
 boundaries[boundaries.length-1]=1;
 const fs=parseFloat(getComputedStyle(wXi).fontSize);
 set(wCaret,'width',`${Math.max(1,Math.round(fs*.055))}px`);
 set(wCaret,'height',`${Math.round(fs*.72)}px`);
 set(wCaret,'top',`${Math.round(box.top+fs*.13)-box.top}px`);
 set(wXi,'transform',original);plane.style.transform=transform;plane.style.setProperty('--tilt-depth',depth);
}
function render(seconds){
 const f=seconds*FPS,discrete=Math.floor(f+1e-7);
 if(lastPortraitFrame<0 || (discrete!==lastPortraitFrame && (discrete<=40 || lastPortraitFrame<40))){
  drawPortrait(discrete);lastPortraitFrame=discrete;
 }
 const slide=track(SLIDE_KEYS,(f-40)*34/26);
 set(pwrap,'transform',`translate(calc(var(--slide-x)*${slide.toFixed(6)}),calc(var(--slide-y)*${slide.toFixed(6)}))`);
 for(const [el,start] of [[wXi,54],[wAuto,56]]){
  const ink=track(SLIDE_KEYS,(f-start)*34/22);
  set(el,'transform',`translateX(calc(var(--stage)*${(.121875*(1-ink)).toFixed(6)}))`);
  set(el,'opacity',track(INK_OPACITY,f-start).toFixed(4));
 }
 const df=Math.max(0,Math.min(f,DEL_TO)-DEL_FROM);
 const erased=Math.min(chars.length,Math.floor(df/DEL_STEP));
 // The caret travel and the erasure share one progress value, so the caret
 // lands on the new boundary on the same frame the character reaches zero.
 const p=Math.min(1,prog(df-erased*DEL_STEP,0,DEL_TRAVEL));
 let boundary=boundaries[chars.length-erased];
 if(erased<chars.length)boundary+=(boundaries[chars.length-erased-1]-boundary)*p;
 // Move the caret with a transform, rather than triggering layout with left.
 const left=Math.round(boxLeft+boundary*textWidth)-boxLeft;
 set(wCaret,'left','0px');set(wCaret,'transform',`translateX(${left}px)`);
 const busy=f>=DEL_FROM && f<DEL_TO;
 set(wCaret,'opacity',f<CUR_ON?'0':busy || (discrete-CUR_ON)%12<8?'1':'0');
 for(let i=0;i<chars.length;i++)set(chars[chars.length-1-i],'opacity',(1-Math.min(1,prog(df-i*DEL_STEP,0,DEL_TRAVEL))).toFixed(4));
}
function loadImage(src){
 return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('Portrait image decode failed'));image.src=src;});
}
let images;
function sizeCanvas(){
 const size=Math.min(1254,Math.max(1,Math.round(pwrap.offsetWidth*Math.min(2,devicePixelRatio||1))));
 if(size===SZ)return;
 SZ=size;CW=SZ/COLS;CH=SZ/ROWS;
 for(const c of [canvas,base,ghost])c.width=c.height=SZ;
 base.getContext('2d').drawImage(images[0],0,0,SZ,SZ);
 ghost.getContext('2d').drawImage(images[1],0,0,SZ,SZ);
 ctx.imageSmoothingEnabled=false;lastPortraitFrame=-1;
}
const resources=Promise.all([
 loadImage('{{IMAGE_DATA_URI}}'),loadImage('{{GHOST_DATA_URI}}'),
 document.fonts.load('400 100px "Cal Sans"').catch(()=>[])
]).then(loaded=>{images=loaded;ready=true;sizeCanvas();measureChars();});
const player=createPlayback({duration:DURATION,render,ready:resources,freeze:freezeTime,clickTarget:stage,
 reset(){lastPortraitFrame=-1;tilt.reset();}});
addEventListener('resize',()=>{
 if(!ready || resizeRAF)return;
 resizeRAF=requestAnimationFrame(()=>{resizeRAF=0;sizeCanvas();measureChars();render(player.state.time);});
});
</script>
</body>
</html>
